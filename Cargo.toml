[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/memory",
    "crates/system",
    "crates/document",
    "crates/embeddings",
    "crates/search",
    "crates/models",
    "crates/voice",
    "crates/assistant",
    "crates/api",
    "crates/ui-tui",
    "crates/ui-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio          = { version = "1", features = ["full"] }
anyhow         = "1"
thiserror      = "1"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
rusqlite       = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait    = "0.1"
chrono         = { version = "0.4", features = ["serde"] }
uuid           = { version = "1", features = ["v4", "serde"] }
reqwest        = { version = "0.12", features = ["json", "stream"] }
futures        = "0.3"