[package]
name = "aios-system"
version = "0.1.0"
edition = "2021"

[dependencies]
aios-shared      = { path = "../shared" }
aios-memory      = { path = "../memory" }
aios-document    = { path = "../document" }
aios-embeddings  = { path = "../embeddings" }
aios-search      = { path = "../search" }
anyhow.workspace = true
tracing.workspace = true
tokio.workspace  = true
serde.workspace  = true
serde_json.workspace = true
uuid.workspace   = true
chrono.workspace = true
rusqlite.workspace = true
notify           = "6"
walkdir          = "2"
screenshots      = "0.8"
base64           = "0.22"
rusty-tesseract  = "1.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }