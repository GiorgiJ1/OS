[package]
name = "aios-skills"
version = "0.1.0"
edition = "2021"

[dependencies]
aios-shared      = { path = "../shared" }
aios-memory      = { path = "../memory" }
anyhow           = "1"
thiserror        = "1"
tracing          = "0.1"
tokio            = { version = "1", features = ["full"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
async-trait      = "0.1"
reqwest          = { version = "0.12", features = ["json"] }
regex            = "1"
urlencoding = "2"