[package]
name = "aios-ui-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aios-desktop"
path = "src/main.rs"

[dependencies]
aios-shared      = { path = "../shared" }
aios-assistant   = { path = "../assistant" }
aios-memory      = { path = "../memory" }
aios-document    = { path = "../document" }
aios-embeddings  = { path = "../embeddings" }
aios-search      = { path = "../search" }
aios-system      = { path = "../system" }
aios-models      = { path = "../models" }
anyhow           = "1"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio            = { version = "1", features = ["full"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
uuid             = { version = "1", features = ["v4", "serde"] }
dotenvy          = "0.15"
eframe           = { version = "0.29", features = ["default_fonts", "persistence"] }
egui             = "0.29"
egui_extras      = "0.29"
tokio-util       = "0.7"