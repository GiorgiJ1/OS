<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: rgba(8, 8, 20, 0.96);
    border: 1px solid #534AB7;
    border-radius: 14px;
    overflow: hidden;
    width: 400px;
    height: 500px;
    font-family: monospace;
    color: #e0e0ff;
    font-size: 13px;
    box-shadow: 0 0 40px rgba(83,74,183,0.4);
  }

  #header {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid #1a1a3a;
    font-size: 11px;
    color: #534AB7;
  }

  #dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #1D9E75;
    margin-right: 8px;
    transition: background 0.3s;
  }

  #dot.thinking {
    background: #EF9F27;
    animation: pulse 0.5s infinite alternate;
  }

  @keyframes pulse { from { opacity:1; } to { opacity:0.2; } }

  #close {
    margin-left: auto;
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
  }
  #close:hover { color: #e0e0ff; }

  #msgs {
    height: 360px;
    overflow-y: auto;
    padding: 12px 14px;
    line-height: 1.7;
    scrollbar-width: thin;
    scrollbar-color: #534AB7 transparent;
  }

  .msg-u {
    color: #9FE1CB;
    margin-bottom: 8px;
    font-size: 12px;
    text-align: right;
    padding: 6px 10px;
    background: rgba(159,225,203,0.08);
    border-radius: 8px;
    margin-left: 40px;
  }

  .msg-a {
    color: #e0e0ff;
    margin-bottom: 10px;
    font-size: 12px;
    line-height: 1.7;
    padding: 6px 10px;
    background: rgba(83,74,183,0.12);
    border-radius: 8px;
    margin-right: 40px;
  }

  #bar {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid #1a1a3a;
  }

  #inp {
    flex: 1;
    background: #0a0a1f;
    border: 1px solid #534AB7;
    border-radius: 8px;
    color: #e0e0ff;
    padding: 8px 12px;
    font-family: monospace;
    font-size: 12px;
    outline: none;
  }
  #inp:focus { border-color: #9FE1CB; }

  #btn {
    background: #534AB7;
    border: none;
    border-radius: 8px;
    color: white;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 14px;
  }
  #btn:hover { background: #7F77DD; }
</style>
</head>
<body>

<div id="header">
  <div id="dot"></div>
  <span id="status">AIOS — ready</span>
  <span id="close" onclick="closeChat()">✕</span>
</div>

<div id="msgs">
  <div class="msg-a">quack. ask me anything.</div>
</div>

<div id="bar">
  <input id="inp" type="text" placeholder="ask anything..."
         autocomplete="off"
         onkeydown="if(event.key==='Enter') send(); if(event.key==='Escape') closeChat();"/>
  <button id="btn" onclick="send()">→</button>
</div>

<script>
function setState(s) {
  const dot    = document.getElementById('dot');
  const status = document.getElementById('status');
  dot.className = s === 'thinking' ? 'thinking' : '';
  status.textContent = s === 'thinking' ? 'AIOS — thinking...'
                     : s === 'alert'    ? 'AIOS — hey!'
                     : 'AIOS — ready';
}

async function closeChat() {
  if (!window.__TAURI__) return;
  await window.__TAURI__.core.invoke('toggle_chat', { duckX: 0, duckY: 0 });
  window.__TAURI__.event.emit('chat-closed', null);
}

async function send() {
  const inp  = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';

  const msgs = document.getElementById('msgs');
  const u    = document.createElement('div');
  u.className   = 'msg-u';
  u.textContent = text;
  msgs.appendChild(u);

  const a    = document.createElement('div');
  a.className   = 'msg-a';
  a.textContent = '';
  msgs.appendChild(a);
  msgs.scrollTop = msgs.scrollHeight;

  setState('thinking');

  try {
    await window.__TAURI__.core.invoke('send_message', { message: text });
  } catch(e) {
    a.textContent = 'Error: ' + e;
    setState('idle');
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!window.__TAURI__) return;
  document.getElementById('inp').focus();
  const { listen } = window.__TAURI__.event;

  await listen('aios-response-chunk', e => {
    const msgs = document.getElementById('msgs');
    let last   = msgs.querySelector('.msg-a:last-child');
    if (!last) {
      last = document.createElement('div');
      last.className = 'msg-a';
      msgs.appendChild(last);
    }
    last.textContent += e.payload;
    msgs.scrollTop = msgs.scrollHeight;
  });

  await listen('aios-response-done', () => setState('idle'));
  await listen('aios-state', e => setState(e.payload));
});
</script>
</body>
</html>
