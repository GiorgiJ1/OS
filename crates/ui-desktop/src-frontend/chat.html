<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: rgba(8, 8, 20, 0.96);
    border: 1px solid #534AB7;
    border-radius: 14px;
    overflow: hidden;
    width: 400px;
    height: 500px;
    font-family: monospace;
    color: #e0e0ff;
    font-size: 13px;
    box-shadow: 0 0 40px rgba(83,74,183,0.4);
  }

  #header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid #1a1a3a;
    font-size: 11px;
    color: #534AB7;
    flex-shrink: 0;
  }

  #dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #1D9E75;
    margin-right: 8px;
    transition: background 0.3s;
    flex-shrink: 0;
  }

  #dot.thinking {
    background: #EF9F27;
    animation: pulse 0.5s infinite alternate;
  }

  @keyframes pulse { from{opacity:1} to{opacity:0.2} }

  #close {
    margin-left: auto;
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
    color: #534AB7;
  }
  #close:hover { color: #e0e0ff; }

  #msgs {
    height: 360px;
    overflow-y: auto;
    padding: 10px 12px;
    line-height: 1.7;
    scrollbar-width: thin;
    scrollbar-color: #534AB7 transparent;
    flex: 1;
  }

  .msg-u {
    color: #9FE1CB;
    margin-bottom: 8px;
    font-size: 12px;
    text-align: right;
    padding: 6px 10px;
    background: rgba(159,225,203,0.08);
    border-radius: 8px;
    margin-left: 40px;
  }

  .msg-a {
    color: #e0e0ff;
    margin-bottom: 10px;
    font-size: 12px;
    line-height: 1.7;
    padding: 6px 10px;
    background: rgba(83,74,183,0.12);
    border-radius: 8px;
    margin-right: 40px;
  }

  .msg-a::before { content: "🦆 "; }

  .msg-diagram {
    margin-bottom: 12px;
    background: rgba(83,74,183,0.08);
    border: 1px solid #1a1a3a;
    border-radius: 10px;
    overflow: hidden;
    padding: 8px;
  }

  .msg-diagram svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .msg-diagram .diagram-label {
    font-size: 10px;
    color: #534AB7;
    text-align: center;
    margin-top: 4px;
    padding-bottom: 2px;
  }

  #bar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid #1a1a3a;
    flex-shrink: 0;
  }

  #inp {
    flex: 1;
    background: #0a0a1f;
    border: 1px solid #534AB7;
    border-radius: 8px;
    color: #e0e0ff;
    padding: 7px 10px;
    font-family: monospace;
    font-size: 12px;
    outline: none;
  }
  #inp:focus { border-color: #9FE1CB; }

  #btn {
    background: #534AB7;
    border: none;
    border-radius: 8px;
    color: white;
    padding: 7px 14px;
    cursor: pointer;
    font-size: 14px;
  }
  #btn:hover { background: #7F77DD; }

  .thinking-dots::after {
    content: '...';
    animation: dots 1s steps(4, end) infinite;
  }
  @keyframes dots {
    0%,20%  { content: '.';   }
    40%     { content: '..';  }
    60%,100%{ content: '...'; }
  }
</style>
</head>
<body>

<div id="header">
  <div id="dot"></div>
  <span id="status">AIOS — ready</span>
  <span id="close" onclick="closeChat()">✕</span>
</div>

<div id="msgs">
  <div class="msg-a">quack. ask me anything — or say <em>/diagram</em> to get a visual.</div>
</div>

<div id="bar">
  <input id="inp" type="text" placeholder="ask anything... or /diagram"
         autocomplete="off"
         onkeydown="if(event.key==='Enter') send(); if(event.key==='Escape') closeChat();"/>
  <button id="btn" onclick="send()">→</button>
</div>

<script>
const DIAGRAM_SYSTEM = `You are AIOS, a personal AI assistant. When the user asks for a diagram, flowchart, visual algorithm, or says /diagram, you MUST respond with ONLY a valid SVG element — no explanation, no markdown, no text before or after. Just raw SVG starting with <svg and ending with </svg>.

SVG rules:
- viewBox="0 0 360 H" where H fits content
- background: transparent
- Use these colors only: #534AB7 (purple), #1D9E75 (teal), #E07B10 (orange), #e0e0ff (light text), #9FE1CB (green text), #1a1a3a (dark border)
- Boxes: rect with rx="6", fill="#1a1a3a", stroke="#534AB7", stroke-width="0.5"
- Text: fill="#e0e0ff", font-family="monospace", font-size="12" for labels, font-size="10" for subtitles
- Arrows: line or path with stroke="#534AB7", stroke-width="1", marker-end="url(#arrow)"
- Always include arrow marker in defs
- Keep it clean and minimal — dark theme
- Max 6 nodes per diagram
- Make it actually useful and accurate for what the user asked`;

function setState(s) {
  const dot    = document.getElementById('dot');
  const status = document.getElementById('status');
  dot.className = s === 'thinking' ? 'thinking' : '';
  status.textContent = s === 'thinking' ? 'AIOS — thinking...'
                     : s === 'alert'    ? 'AIOS — hey!'
                     : 'AIOS — ready';
}

function addMsg(cls, html, isHtml = false) {
  const msgs = document.getElementById('msgs');
  const d    = document.createElement('div');
  d.className = cls;
  if (isHtml) d.innerHTML = html;
  else d.textContent = html;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function renderDiagram(svgString, label) {
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = 'msg-diagram';
  wrap.innerHTML = svgString;
  const lbl = document.createElement('div');
  lbl.className = 'diagram-label';
  lbl.textContent = label || 'generated diagram';
  wrap.appendChild(lbl);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function isSvgResponse(text) {
  const t = text.trim();
  return t.startsWith('<svg') || t.includes('<svg ') || t.includes('<svg\n');
}

function extractSvg(text) {
  const start = text.indexOf('<svg');
  const end   = text.lastIndexOf('</svg>');
  if (start === -1 || end === -1) return null;
  return text.slice(start, end + 6);
}

async function callOllamaForDiagram(prompt) {
  if (!window.__TAURI__) return null;
  try {
    const result = await window.__TAURI__.core.invoke('generate_diagram', {
      prompt: prompt,
      system: DIAGRAM_SYSTEM,
    });
    return result;
  } catch(e) {
    console.error('diagram error:', e);
    return null;
  }
}

async function send() {
  const inp  = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';

  addMsg('msg-u', text);
  setState('thinking');

    const isDiagramRequest =
        text.startsWith('/diagram') ||
        (text.toLowerCase().includes('diagram') && !text.toLowerCase().includes('hello')) ||
        text.toLowerCase().includes('flowchart') ||
        text.toLowerCase().includes('draw me') ||
        text.toLowerCase().includes('show me how') ||
        text.toLowerCase().includes('visual algorithm');

  if (isDiagramRequest) {
    // Extract what to diagram
    const subject = text.replace('/diagram', '').trim() ||
                    'what AIOS is doing right now';

    const thinking = addMsg('msg-a', '', true);
    thinking.innerHTML = '🦆 <span class="thinking-dots">generating diagram</span>';

    const svgResult = await callOllamaForDiagram(
      `Draw a diagram for: ${subject}. Reply with SVG only.`
    );

    thinking.remove();

    if (svgResult) {
      const svg = extractSvg(svgResult);
      if (svg) {
        renderDiagram(svg, subject);
        setState('idle');
        return;
      }
    }

    // Fallback — generate a simple SVG locally
    renderDiagram(makeFallbackDiagram(subject), subject);
    setState('idle');
    return;
  }

  // Normal chat
  const respEl = document.createElement('div');
  respEl.className = 'msg-a';
  respEl.textContent = '';
  document.getElementById('msgs').appendChild(respEl);

  try {
    await window.__TAURI__.core.invoke('send_message', { message: text });
  } catch(e) {
    respEl.textContent = 'Error: ' + e;
    setState('idle');
  }
}

// Fallback diagram for when LLM doesn't return clean SVG
function makeFallbackDiagram(subject) {
  return `<svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="100" height="40" rx="6"
    fill="#1a1a3a" stroke="#534AB7" stroke-width="0.5"/>
  <text x="60" y="64" text-anchor="middle"
    font-family="monospace" font-size="11" fill="#e0e0ff">you</text>
  <line x1="110" y1="60" x2="148" y2="60"
    stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="150" y="40" width="100" height="40" rx="6"
    fill="#1a1a3a" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="200" y="57" text-anchor="middle"
    font-family="monospace" font-size="11" fill="#9FE1CB">AIOS</text>
  <text x="200" y="72" text-anchor="middle"
    font-family="monospace" font-size="9" fill="#534AB7">${subject.slice(0,18)}</text>
  <line x1="250" y1="60" x2="288" y2="60"
    stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="290" y="40" width="60" height="40" rx="6"
    fill="#1a1a3a" stroke="#E07B10" stroke-width="0.5"/>
  <text x="320" y="64" text-anchor="middle"
    font-family="monospace" font-size="11" fill="#e0e0ff">answer</text>
</svg>`;
}

async function closeChat() {
  if (!window.__TAURI__) return;
  await window.__TAURI__.core.invoke('toggle_chat', { duckX: 0, duckY: 0 });
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!window.__TAURI__) return;
  document.getElementById('inp').focus();
  const { listen } = window.__TAURI__.event;

  await listen('aios-response-chunk', e => {
    const msgs = document.getElementById('msgs');
    let last   = msgs.querySelector('.msg-a:last-child');
    if (!last) {
      last = document.createElement('div');
      last.className = 'msg-a';
      msgs.appendChild(last);
    }
    last.textContent += e.payload;
    msgs.scrollTop = msgs.scrollHeight;

    // Check if the full response is an SVG
    if (isSvgResponse(last.textContent)) {
      const svg = extractSvg(last.textContent);
      if (svg) {
        last.remove();
        renderDiagram(svg, 'generated diagram');
      }
    }
  });

  await listen('aios-response-done', () => setState('idle'));
  await listen('aios-state', e => setState(e.payload));
});
</script>
</body>
</html>
